name: MCP preview packages

on:
  push:
    tags: ['mcp-preview-build-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: '29'
  ELIXIR_VERSION: '1.20.4'
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  RIPGREP_VERSION: '15.2.0'

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_x64
            runner: ubuntu-22.04
            release: genesis_server
            vendor: linux-x86_64
            rg_target: x86_64-unknown-linux-musl
            rg_sha: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
          - platform: linux_arm64
            runner: ubuntu-22.04-arm
            release: genesis_server
            vendor: linux-arm64
            rg_target: aarch64-unknown-linux-gnu
            rg_sha: a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d
          - platform: darwin_arm64
            runner: macos-15
            release: genesis_server
            vendor: macos-arm64
            rg_target: aarch64-apple-darwin
            rg_sha: 3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4
          - platform: darwin_x64
            runner: macos-15-intel
            release: genesis_server
            vendor: macos-x86_64
            rg_target: x86_64-apple-darwin
            rg_sha: af7825fcc69a2afc7a7aea55fc9af90e26421d8f20fe59df32e233c0b8a231c1
          - platform: windows_x64
            runner: windows-2022
            release: genesis_desktop
            vendor: windows-x64
            rg_target: x86_64-pc-windows-msvc
            rg_sha: 71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set ARM image metadata
        if: matrix.platform == 'linux_arm64'
        run: echo 'ImageOS=ubuntu22' >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: mcp-preview-${{ matrix.platform }}
      - name: Installer behavior tests
        run: |
          python scripts/test-install-codex.py
          python scripts/test-install-windows.py
          python scripts/test-setup-platforms.py
          python scripts/test-install-platforms.py
      - name: Bundle the established development tools
        env:
          VENDOR_PLATFORM: ${{ matrix.vendor }}
          RG_TARGET: ${{ matrix.rg_target }}
          RG_SHA256: ${{ matrix.rg_sha }}
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "$VENDOR_DIR" "$DOWNLOAD_DIR"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}.zip" -o "$DOWNLOAD_DIR/rg.zip"
            echo "$RG_SHA256  $DOWNLOAD_DIR/rg.zip" | sha256sum -c -
            unzip -o "$DOWNLOAD_DIR/rg.zip" -d "$DOWNLOAD_DIR/rg"
            cp "$DOWNLOAD_DIR/rg/$RG_ARCHIVE/rg.exe" "$VENDOR_DIR/rg.exe"
            curl -fsSL "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip" -o "$DOWNLOAD_DIR/mingit.zip"
            echo "56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e  $DOWNLOAD_DIR/mingit.zip" | sha256sum -c -
            unzip -o "$DOWNLOAD_DIR/mingit.zip" -d "$VENDOR_DIR/mingit"
          else
            curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}.tar.gz" -o "$DOWNLOAD_DIR/rg.tar.gz"
            python -c "import hashlib; from pathlib import Path; assert hashlib.sha256(Path('$DOWNLOAD_DIR/rg.tar.gz').read_bytes()).hexdigest() == '$RG_SHA256'"
            tar -xzf "$DOWNLOAD_DIR/rg.tar.gz" -C "$DOWNLOAD_DIR"
            cp "$DOWNLOAD_DIR/$RG_ARCHIVE/rg" "$VENDOR_DIR/rg"
            chmod +x "$VENDOR_DIR/rg"
            if [ "$RUNNER_OS" = Linux ]; then cp "$(command -v git)" "$VENDOR_DIR/git"; fi
          fi
      - name: Build the existing runtime
        run: MIX_ENV=prod mix release ${{ matrix.release }} --overwrite
      - name: Save native compilation before installation verification
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _build
          key: mix-build-mcp-preview-${{ matrix.platform }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
      - name: Save native dependency sources before installation verification
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: mix-deps-mcp-preview-${{ matrix.platform }}-${{ hashFiles('mix.lock') }}
      - name: Set up Rust for the existing Windows headless host
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97.1'
      - name: Build the existing Windows host
        if: runner.os == 'Windows'
        run: |
          python -c "import shutil; shutil.copytree('_build/prod/rel/genesis_desktop', 'desktop/src-tauri/resources/genesis-backend', dirs_exist_ok=True)"
          cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Package native release
        run: python scripts/package-mcp.py --platform ${{ matrix.platform }} --release-dir _build/prod/rel/${{ matrix.release }}
      - name: Prepare actual Codex CLI
        run: |
          npm install --prefix .mcp-client @openai/codex@0.167.0
          python -c "import os; from pathlib import Path; p=Path('.mcp-client/node_modules/.bin').resolve(); open(os.environ['GITHUB_PATH'],'a').write(str(p)+'\n')"
      - name: Verify native installation, MCP and Codex registration
        run: python scripts/smoke-mcp.py --platform ${{ matrix.platform }} --assets dist
      - name: Upload verified native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-preview-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
